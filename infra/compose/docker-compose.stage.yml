name: portfolioapp-stage

services:
  nginx:
    image: ${NGINX_IMAGE}:${TAG}
    container_name: nginx-stage
    ports:
      - "${STAGE_BIND_IP:-100.106.47.103}:8081:80"
      - "${STAGE_BIND_IP:-100.106.47.103}:8082:81"
    depends_on:
      - backend
      - frontend
      - bakery
    networks:
      - app_net_stage
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}:${TAG}
    container_name: backend-stage
    env_file:
      - ../env/.env.stage
    expose:
      - "8000"
    networks:
      - app_net_stage
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}:${TAG}
    container_name: frontend-stage
    env_file:
      - ../env/.env.stage
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - app_net_stage
    restart: unless-stopped

  bakery:
    image: ${BAKERY_IMAGE:-ghcr.io/kencopas/portfolio-bakery}:${TAG}
    container_name: bakery-stage
    environment:
      NODE_ENV: production
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app_net_stage

  postgres:
    image: postgres:16-alpine
    container_name: postgres-stage
    restart: unless-stopped

    env_file:
      - ../env/.env.stage

    volumes:
      - postgres_data_stage:/var/lib/postgresql/data

    networks:
      - app_net_stage

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${BACKEND_IMAGE}:${TAG}
    command: uv run alembic upgrade head
    container_name: migrate-stage
    env_file: ../env/.env.stage
    networks:
      - app_net_stage
    depends_on:
      - postgres

volumes:
  postgres_data_stage:

networks:
  app_net_stage:
    driver: bridge
