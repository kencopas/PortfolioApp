server {
    listen 80;
    # Staging publishes this listener on its Tailscale IP for browser verification.
    listen 81 default_server;
    server_name velvetpawbakery.com www.velvetpawbakery.com;

    location / {
        proxy_pass http://bakery:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}

map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
    http http;
}
